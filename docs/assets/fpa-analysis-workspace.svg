<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Governed FP&amp;A analysis workspace</title>
  <desc id="desc">A dark navy and white reconstructed finance analysis interface using synthetic portfolio data.</desc>
  <defs>
