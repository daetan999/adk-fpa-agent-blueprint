    <tspan x="1142" dy="22">budget. Singapore North offset part of the</tspan>
    <tspan x="1142" dy="22">shortfall, while Thailand and Vietnam were</tspan>
    <tspan x="1142" dy="22">the largest negative contributors.</tspan>
